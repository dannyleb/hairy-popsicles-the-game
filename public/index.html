<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Hairy Popsicles</title>
  <meta name="description" content="Hairy Popsicles — a hand-drawn 3D free-roam game." />
  <meta name="theme-color" content="#f5f6ec" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%226.5%22 y=%229%22 width=%223%22 height=%227%22 rx=%221.5%22 fill=%22%23dcb57c%22 stroke=%22%231b1a17%22/%3E%3Cellipse cx=%228%22 cy=%226%22 rx=%225%22 ry=%225.5%22 fill=%22%23f0c49a%22 stroke=%22%231b1a17%22/%3E%3Ccircle cx=%226%22 cy=%225.5%22 r=%221.2%22 fill=%22%231b1a17%22/%3E%3Ccircle cx=%2210%22 cy=%225.5%22 r=%221.2%22 fill=%22%231b1a17%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik+Wet+Paint&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="objective">
        <div class="objLabel">OBJECTIVE</div>
        <div id="objTitle">&mdash;</div>
        <div id="objSub"></div>
      </div>
    </header>

    <main id="viewport">
      <canvas id="gameCanvas"></canvas>
      <div id="toast"></div>
      <div id="dpad" aria-label="Direction pad">
        <div class="arrow up"></div><div class="arrow right"></div><div class="arrow down"></div><div class="arrow left"></div>
        <div class="hub"></div>
      </div>
    </main>
  </div>

  <div id="startOverlay">
    <div id="startCard">
      <div class="lineup" aria-hidden="true">
        <img src="assets/sprites/weeper.webp" alt="" />
        <img src="assets/sprites/conehead.webp" alt="" />
        <img src="assets/sprites/antenna.webp" alt="" />
        <img src="assets/sprites/melter.webp" alt="" />
        <img src="assets/sprites/screamer.webp" alt="" />
      </div>
      <h1>Hairy Popsicles</h1>
      <p>Everyone's melting. Wander the page.</p>
      <div class="controlsGrid">
        <div><strong>Keyboard</strong><br/>WASD / arrows &mdash; walk<br/>Shift &mdash; run</div>
        <div><strong>Touch</strong><br/>D-pad &mdash; walk</div>
      </div>
      <button id="pressStart" class="chunk" disabled>LOADING&hellip;</button>
      <p class="fine"><span id="buildTag">dev build</span> &middot; all art hand-drawn</p>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
